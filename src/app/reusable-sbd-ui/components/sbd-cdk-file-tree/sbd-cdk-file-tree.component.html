<div class="w-full bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden font-sans text-xs">
  <!-- Header Bar -->
  <div class="flex items-center justify-between px-4 py-3 bg-[#00205B] text-white">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-4 bg-[#009CDE] rounded-full"></span>
      <h3 class="font-bold uppercase tracking-wider text-white">{{ title }}</h3>
    </div>
    <span class="px-2 py-0.5 text-[10px] font-semibold bg-white/15 rounded">
      Angular CDK
    </span>
  </div>

  <!-- Search Filter -->
  @if (searchable) {
    <div class="p-2.5 bg-slate-50 border-b border-slate-200">
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Filtrer l'arborescence (CDK)..."
        class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#009CDE]"
      />
    </div>
  }

  <!-- CDK Tree Container -->
  <div class="p-2.5 max-h-[400px] overflow-y-auto select-none bg-white">
    @if (nodes.length === 0) {
      <div class="py-6 text-center text-slate-400 text-xs font-sans">
        Aucune donnée d'arborescence disponible
      </div>
    } @else {
      <cdk-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <!-- Leaf Node -->
        <cdk-nested-tree-node *cdkTreeNodeDef="let node" class="block my-0.5">
          <ng-container *ngTemplateOutlet="nodeRow; context: { $implicit: node, isFolder: false }"></ng-container>
        </cdk-nested-tree-node>

        <!-- Parent Folder Node -->
        <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: hasChild" class="block my-0.5">
          <ng-container *ngTemplateOutlet="nodeRow; context: { $implicit: node, isFolder: true }"></ng-container>
          <div [class.hidden]="!treeControl.isExpanded(node)" class="border-l border-slate-200 ml-3 pl-1 transition-all">
            <ng-container cdkTreeNodeOutlet></ng-container>
          </div>
        </cdk-nested-tree-node>
      </cdk-tree>
    }
  </div>
</div>

<!-- Reusable Node Row Template -->
<ng-template #nodeRow let-node let-isFolder="isFolder">
  <div
    (click)="onSelect(node, $event)"
    [class.bg-[#E0F2FE]]="selectedNodeId === node.id"
    [class.border-l-4]="selectedNodeId === node.id"
    [class.border-[#00205B]]="selectedNodeId === node.id"
    [class.ml-4]="!isFolder"
    class="group flex items-center justify-between py-1.5 px-2 hover:bg-slate-50 cursor-pointer rounded transition-all"
  >
    <div class="flex items-center gap-2 truncate">
      @if (isFolder) {
        <button
          type="button"
          (click)="toggleNode(node, $event)"
          class="p-0.5 text-slate-400 hover:text-slate-700 transition-transform duration-150"
          [class.rotate-90]="treeControl.isExpanded(node)"
        >
          ▶
        </button>
      } @else {
        <span class="w-3 inline-block"></span>
      }

      <span class="shrink-0 text-sm">
        {{ isFolder ? (treeControl.isExpanded(node) ? '📂' : '📁') : '📄' }}
      </span>

      <span [class.font-semibold]="isFolder" class="truncate text-slate-800">
        {{ node.name }}
      </span>
    </div>

    @if (node.badge || node.size) {
      <span class="text-[10px] text-slate-400 font-mono shrink-0 ml-2">
        {{ node.badge || node.size }}
      </span>
    }
  </div>
</ng-template>

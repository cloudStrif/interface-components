<div class="w-full bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden font-sans">
  <div class="flex items-center justify-between px-4 py-3 bg-[#00205B] text-white">
    <h3 class="text-xs font-bold uppercase tracking-wider text-white">
      {{ title }}
    </h3>
    <span class="px-2 py-0.5 text-[10px] font-semibold bg-white/15 rounded">
      {{ filteredNodes().length }} élément(s)
    </span>
  </div>

  @if (searchable) {
    <div class="p-2.5 bg-slate-50 border-b border-slate-200">
      <input
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        placeholder="Filtrer..."
        class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#009CDE]"
      />
    </div>
  }

  <div class="p-2.5 max-h-[400px] overflow-y-auto bg-white">
    @if (filteredNodes().length === 0) {
      <div class="py-6 text-center text-slate-400 text-xs">Aucun résultat</div>
    } @else {
      @for (node of filteredNodes(); track node.id) {
        <app-sbd-file-tree-node
          [node]="node"
          [level]="0"
          [selectedNodeId]="selectedNodeId"
          [nodeActions]="nodeActions"
          (nodeSelect)="nodeSelect.emit($event)"
          (nodeToggle)="nodeToggle.emit($event)"
          (nodeAction)="nodeAction.emit($event)"
        ></app-sbd-file-tree-node>
      }
    }
  </div>
</div>

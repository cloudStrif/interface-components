<form [formGroup]="formGroup" (ngSubmit)="onSubmit($event)" class="space-y-4 font-sans text-xs">
  @if (title) {
    <h3 class="text-sm font-bold text-[#00205B] uppercase tracking-wider border-b border-slate-100 pb-2">
      {{ title }}
    </h3>
  }

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (field of fields; track field.key) {
      <div [class.md:col-span-2]="field.gridCols === 'full' || field.type === 'textarea'" class="flex flex-col gap-1">
        <label [for]="field.key" class="font-bold text-[#00205B]">
          {{ field.label }}
          @if (field.validation?.required) { <span class="text-rose-600">*</span> }
        </label>

        @switch (field.type) {
          @case ('textarea') {
            <textarea
              [id]="field.key"
              [formControlName]="field.key"
              [placeholder]="field.placeholder || ''"
              rows="3"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-[#009CDE]"
            ></textarea>
          }
          @case ('select') {
            <select
              [id]="field.key"
              [formControlName]="field.key"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-[#009CDE]"
            >
              <option value="">{{ field.placeholder || 'Sélectionner...' }}</option>
              @for (opt of field.options; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          }
          @case ('checkbox') {
            <label class="flex items-center gap-2 cursor-pointer mt-1">
              <input
                type="checkbox"
                [formControlName]="field.key"
                class="w-4 h-4 rounded border-slate-300 text-[#009CDE] focus:ring-0"
              />
              <span class="text-slate-700 font-medium">{{ field.placeholder || field.label }}</span>
            </label>
          }
          @default {
            <input
              [id]="field.key"
              [type]="field.type || 'text'"
              [formControlName]="field.key"
              [placeholder]="field.placeholder || ''"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-[#009CDE]"
            />
          }
        }

        @if (isFieldInvalid(field.key)) {
          <span class="text-[11px] text-rose-600 font-semibold">Ce champ est requis ou invalide.</span>
        }
      </div>
    }
  </div>

  <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
    @if (showReset) {
      <button
        type="button"
        (click)="formGroup.reset()"
        class="px-3.5 py-1.5 text-xs font-semibold text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all"
      >
        Réinitialiser
      </button>
    }
    <button
      type="button"
      (click)="formCancel.emit()"
      class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all"
    >
      Annuler
    </button>
    <button
      type="submit"
      [disabled]="loading"
      class="px-5 py-2 text-xs font-bold text-white bg-[#00205B] hover:bg-[#001744] rounded-lg transition-all shadow-xs disabled:opacity-50"
    >
      {{ loading ? 'Chargement...' : (config.submitLabel || submitLabel) }}
    </button>
  </div>
</form>

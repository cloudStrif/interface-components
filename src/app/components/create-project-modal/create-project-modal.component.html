<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs animate-fadeIn">
  <!-- Modal Card (Pure White Card) -->
  <div class="bg-white border border-slate-200 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative">
    <!-- Header Safran Blue Accent Bar -->
    <div class="h-1.5 w-full bg-[#0055B8]"></div>

    <!-- Header -->
    <div class="p-6 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-50 border border-blue-100 text-[#0055B8] flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-[#001E38] tracking-tight">Nouveau Projet S3000L</h3>
          <p class="text-xs text-slate-500">Initialiser une arborescence logistique (LSA / PBS)</p>
        </div>
      </div>
      
      <button (click)="onClose()" class="text-slate-400 hover:text-slate-700 p-2 rounded-xl hover:bg-slate-100 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form Body -->
    <form (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <!-- FIELD 1: Nom du projet -->
      <div>
        <label for="projectName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
          Nom du projet <span class="text-rose-600">*</span>
        </label>
        <div class="relative">
          <input type="text" 
                 id="projectName"
                 [(ngModel)]="projectName" 
                 name="projectName"
                 required
                 placeholder="ex: M88 Turboréacteur - Découpage PBS" 
                 class="w-full bg-white border border-slate-200 focus:border-[#0055B8] focus:ring-1 focus:ring-blue-100 rounded-xl py-3 px-4 text-sm text-slate-900 placeholder-slate-400 transition-all font-sans shadow-2xs">
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Identifiant unique du projet dans l'environnement Safran S3000L.</p>
      </div>

      <!-- FIELD 2: Version Spécification S3000L (1.1 ou 2.0) -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
          Version Spécification S3000L <span class="text-rose-600">*</span>
        </label>
        
        <!-- Custom Version Card Selector -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" 
                  *ngFor="let ver of versionOptions"
                  (click)="s3000lVersion = ver"
                  [class.border-[#0055B8]]="s3000lVersion === ver"
                  [class.bg-blue-50\/60]="s3000lVersion === ver"
                  [class.ring-1]="s3000lVersion === ver"
                  [class.ring-blue-200]="s3000lVersion === ver"
                  [class.border-slate-200]="s3000lVersion !== ver"
                  class="p-4 rounded-2xl border transition-all text-left flex flex-col justify-between hover:border-blue-300 bg-white shadow-2xs group">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono font-bold px-2 py-0.5 rounded"
                    [class.bg-emerald-50]="ver === '2.0'"
                    [class.text-emerald-700]="ver === '2.0'"
                    [class.border]="true"
                    [class.border-emerald-200]="ver === '2.0'"
                    [class.bg-blue-50]="ver === '1.1'"
                    [class.text-blue-700]="ver === '1.1'"
                    [class.border-blue-200]="ver === '1.1'">
                Issue {{ ver }}
              </span>
              <div class="w-4 h-4 rounded-full border border-slate-300 flex items-center justify-center"
                   [class.border-[#0055B8]]="s3000lVersion === ver"
                   [class.bg-[#0055B8]]="s3000lVersion === ver">
                <div *ngIf="s3000lVersion === ver" class="w-1.5 h-1.5 rounded-full bg-white"></div>
              </div>
            </div>
            <div class="mt-3">
              <div class="text-xs font-bold text-slate-900 group-hover:text-[#0055B8] transition-colors">S3000L Spec {{ ver }}</div>
              <div class="text-[10px] text-slate-500 mt-0.5 leading-normal">
                {{ ver === '2.0' ? 'Norme internationale récente (Modèles LSA 2.0)' : 'Norme internationale établie (Modèles LSA 1.1)' }}
              </div>
            </div>
          </button>
        </div>

        <!-- Standard HTML Select as Backup / Alternative Form UI -->
        <div class="mt-3">
          <select id="s3000lVersion"
                  [(ngModel)]="s3000lVersion"
                  name="s3000lVersionSelect"
                  class="w-full bg-white border border-slate-200 focus:border-[#0055B8] focus:ring-1 focus:ring-blue-100 rounded-xl py-2.5 px-3 text-xs text-slate-700 font-mono shadow-2xs">
            <option value="1.1">Version 1.1 - S3000L Logistics Support Analysis</option>
            <option value="2.0">Version 2.0 - S3000L International Spec (Recommandé)</option>
          </select>
        </div>
      </div>

      <!-- Preview Summary Badge -->
      <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs flex items-center justify-between text-slate-600">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-[#0055B8]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Configuration projet :
        </span>
        <span class="font-bold text-[#001E38] font-mono">
          {{ projectName || 'Sans nom' }} (v{{ s3000lVersion }})
        </span>
      </div>

      <!-- Modal Footer Action Buttons -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button type="button" 
                (click)="onClose()"
                class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
          Annuler
        </button>
        <button type="submit"
                [disabled]="!projectName.trim()"
                class="px-5 py-2.5 rounded-xl bg-[#0055B8] hover:bg-[#004494] text-white text-xs font-semibold shadow-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          Créer le projet
        </button>
      </div>
    </form>
  </div>
</div>

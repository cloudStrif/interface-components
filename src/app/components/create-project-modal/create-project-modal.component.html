<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
  <!-- Modal Card -->
  <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative border-t-cyan-500/50">
    <!-- Header Accent Bar -->
    <div class="h-1.5 w-full bg-gradient-to-r from-indigo-500 via-cyan-500 to-emerald-400"></div>

    <!-- Header -->
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white tracking-tight">Nouveau Projet S3000L</h3>
          <p class="text-xs text-slate-400">Initialiser une arborescence de spécification LSA</p>
        </div>
      </div>
      
      <button (click)="onClose()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form Body -->
    <form (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <!-- FIELD 1: Nom du projet -->
      <div>
        <label for="projectName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Nom du projet <span class="text-rose-400">*</span>
        </label>
        <div class="relative">
          <input type="text" 
                 id="projectName"
                 [(ngModel)]="projectName" 
                 name="projectName"
                 required
                 placeholder="ex: Projet Turbopropulseur TP-4000" 
                 class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl py-3 px-4 text-sm text-white placeholder-slate-500 transition-all font-sans">
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Identifiant unique du projet dans la base de données SL.</p>
      </div>

      <!-- FIELD 2: Dropdown Version S3000L (1.1 ou 2.0) -->
      <div>
        <label for="s3000lVersion" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Version Spécification S3000L <span class="text-rose-400">*</span>
        </label>
        
        <!-- Custom Version Card Selector -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" 
                  *ngFor="let ver of versionOptions"
                  (click)="s3000lVersion = ver"
                  [class.border-cyan-500]="s3000lVersion === ver"
                  [class.bg-slate-800\/80]="s3000lVersion === ver"
                  [class.border-slate-800]="s3000lVersion !== ver"
                  class="p-4 rounded-2xl border transition-all text-left flex flex-col justify-between hover:border-slate-700 bg-slate-950/40 group">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono font-bold px-2 py-0.5 rounded"
                    [class.bg-emerald-500\/20]="ver === '2.0'"
                    [class.text-emerald-400]="ver === '2.0'"
                    [class.bg-indigo-500\/20]="ver === '1.1'"
                    [class.text-indigo-400]="ver === '1.1'">
                Issue {{ ver }}
              </span>
              <div class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center"
                   [class.border-cyan-400]="s3000lVersion === ver"
                   [class.bg-cyan-500]="s3000lVersion === ver">
                <div *ngIf="s3000lVersion === ver" class="w-1.5 h-1.5 rounded-full bg-slate-950"></div>
              </div>
            </div>
            <div class="mt-3">
              <div class="text-xs font-semibold text-white group-hover:text-cyan-400 transition-colors">S3000L Spec {{ ver }}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">
                {{ ver === '2.0' ? 'Norme internationale récente (Modèles LSA 2.0)' : 'Norme internationale établie (Modèles LSA 1.1)' }}
              </div>
            </div>
          </button>
        </div>

        <!-- Standard HTML Select as Backup / Alternative Form UI -->
        <div class="mt-3">
          <select id="s3000lVersion"
                  [(ngModel)]="s3000lVersion"
                  name="s3000lVersionSelect"
                  class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl py-2.5 px-3 text-xs text-slate-300 font-mono">
            <option value="1.1">Version 1.1 - S3000L Logistics Support Analysis</option>
            <option value="2.0">Version 2.0 - S3000L International Spec (Recommandé)</option>
          </select>
        </div>
      </div>

      <!-- Preview Summary Badge -->
      <div class="p-3.5 rounded-xl bg-slate-950/60 border border-slate-800/80 text-xs flex items-center justify-between text-slate-400">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Projet à initialiser :
        </span>
        <span class="font-semibold text-white font-mono">
          {{ projectName || 'Sans nom' }} (v{{ s3000lVersion }})
        </span>
      </div>

      <!-- Modal Footer Action Buttons -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button type="button" 
                (click)="onClose()"
                class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          Annuler
        </button>
        <button type="submit"
                [disabled]="!projectName.trim()"
                class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 via-cyan-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 text-white text-xs font-semibold shadow-lg shadow-cyan-600/20 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          Créer le projet
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Show Login Screen if NOT authenticated via Darwin OIDC -->
<app-login *ngIf="!authService.isAuthenticated()"></app-login>

<!-- Show Main Application Workspace when authenticated -->
<div *ngIf="authService.isAuthenticated()" class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950">
  
  <!-- Global Application Header -->
  <app-header (openNewProjectModal)="openCreateProjectModal()"></app-header>

  <!-- Main S3000L XML Explorer Workspace -->
  <main class="flex-1">
    <app-sbd-explorer></app-sbd-explorer>
  </main>

  <!-- Create Project Modal (Form with 2 fields: Name & S3000L Version 1.1 / 2.0) -->
  <app-create-project-modal *ngIf="showCreateProjectModal" 
                             (closeModal)="closeCreateProjectModal()">
  </app-create-project-modal>
</div>

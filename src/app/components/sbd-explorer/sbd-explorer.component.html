<div class="p-4 lg:p-6 space-y-4 max-w-[1920px] mx-auto min-h-[calc(100vh-4rem)] flex flex-col">

  <!-- Top Controls & XML Upload Bar -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 lg:p-5 backdrop-blur-md shadow-xl flex flex-col xl:flex-row items-stretch xl:items-center justify-between gap-4">
    
    <!-- Left: Title & Dataset Info -->
    <div class="flex items-center gap-4">
      <div class="hidden sm:flex w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 items-center justify-center shrink-0">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-white tracking-tight">Arborescence Spécification S3000L</h2>
          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold"
                [class.bg-emerald-500\/20]="projectService.activeProject().s3000lVersion === '2.0'"
                [class.text-emerald-400]="projectService.activeProject().s3000lVersion === '2.0'"
                [class.bg-indigo-500\/20]="projectService.activeProject().s3000lVersion === '1.1'"
                [class.text-indigo-400]="projectService.activeProject().s3000lVersion === '1.1'">
            Issue {{ projectService.activeProject().s3000lVersion }}
          </span>
        </div>
        <p class="text-xs text-slate-400">Projet actif : <span class="text-cyan-300 font-semibold">{{ projectService.activeProject().name }}</span></p>
      </div>
    </div>

    <!-- Center/Right: File Drag-Drop & Preset Sample Switchers -->
    <div class="flex flex-wrap items-center gap-3">
      
      <!-- Upload XML Input Box -->
      <label (dragover)="onDragOver($event)"
             (dragleave)="onDragLeave($event)"
             (drop)="onDrop($event)"
             [class.border-cyan-400]="isDraggingFile"
             [class.bg-cyan-500\/10]="isDraggingFile"
             class="px-3.5 py-2 rounded-2xl bg-slate-950 border border-slate-700/80 hover:border-cyan-500/60 transition-all cursor-pointer flex items-center gap-2.5 text-xs text-slate-300 group">
        <svg class="w-4 h-4 text-cyan-400 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        <div class="leading-none">
          <span class="font-semibold text-white block">Charger un XML S3000L</span>
          <span class="text-[10px] text-slate-400 font-mono">Glisser-déposer ou parcourir</span>
        </div>
        <input type="file" accept=".xml,.s3000l" class="hidden" (change)="onFileSelected($event)">
      </label>

      <!-- Preset Data Buttons -->
      <div class="flex items-center bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs">
        <span class="text-[10px] text-slate-500 px-2 font-mono uppercase font-semibold">Exemples S3000L :</span>
        <button (click)="loadSample('engine')" 
                class="px-2.5 py-1 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
          Turboréacteur
        </button>
        <button (click)="loadSample('landing_gear')" 
                class="px-2.5 py-1 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
          Atterrisseur
        </button>
        <button (click)="loadSample('avionics')" 
                class="px-2.5 py-1 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
          Avionique AFDX
        </button>
      </div>

    </div>
  </div>

  <!-- Error Alert if XML parsing fails -->
  <div *ngIf="errorMessage" class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center justify-between">
    <span>{{ errorMessage }}</span>
    <button (click)="errorMessage = ''" class="text-rose-400 hover:text-rose-200">Fermer</button>
  </div>

  <!-- Main Grid Workspace: Left Tree (Arborescence) + Right Node Details -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-stretch">
    
    <!-- LEFT PANEL: Tree Navigation (Arborescence S3000L) -->
    <div class="lg:col-span-5 xl:col-span-4 bg-slate-900/80 border border-slate-800 rounded-3xl p-4 flex flex-col backdrop-blur-md min-h-[500px]">
      
      <!-- Tree Search Filter & Expand Controls -->
      <div class="space-y-3 pb-3 border-b border-slate-800">
        <!-- Search Input -->
        <div class="relative">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" 
                 [(ngModel)]="filterQuery" 
                 placeholder="Filtrer l'arborescence (Nom, LCN, balise...)" 
                 class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 rounded-2xl pl-10 pr-4 py-2 text-xs text-white placeholder-slate-500 transition-all font-sans">
        </div>

        <!-- Expand / Collapse All & Stats -->
        <div class="flex items-center justify-between text-xs text-slate-400">
          <div class="flex items-center gap-1.5 font-mono text-[11px]">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span>Éléments actifs</span>
          </div>

          <div class="flex items-center gap-2">
            <button (click)="expandAllNodes()" class="hover:text-cyan-400 text-[11px] transition-colors">Tout déplier</button>
            <span>&bull;</span>
            <button (click)="collapseAllNodes()" class="hover:text-cyan-400 text-[11px] transition-colors">Tout replier</button>
          </div>
        </div>
      </div>

      <!-- Tree Container -->
      <div class="flex-1 overflow-y-auto pt-3 pr-1 space-y-1 min-h-[400px]">
        <app-sbd-tree-node *ngIf="parserService.currentTree() as rootTree" 
                           [node]="rootTree" 
                           [level]="0"
                           [filterQuery]="filterQuery">
        </app-sbd-tree-node>

        <div *ngIf="!parserService.currentTree()" class="py-12 text-center text-slate-500 text-xs">
          Aucune arborescence S3000L chargée.
        </div>
      </div>

    </div>

    <!-- RIGHT PANEL: Selected Node Details -->
    <div class="lg:col-span-7 xl:col-span-8 min-h-[500px]">
      <app-sbd-node-detail></app-sbd-node-detail>
    </div>

  </div>

</div>

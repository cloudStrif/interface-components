<div class="w-full bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden font-sans">
  <!-- Header Bar Safran Corporate -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-4 py-3 bg-[#00205B] text-white">
    <div class="flex items-center gap-2.5">
      <span class="w-1.5 h-5 rounded-full bg-[#009CDE]"></span>
      <h3 class="text-xs font-bold uppercase tracking-wider font-sans text-white">
        {{ title }}
      </h3>
      <span class="px-2 py-0.5 text-[10px] font-semibold text-white/90 bg-white/15 rounded border border-white/20">
        {{ nodes.length }} racine(s)
      </span>
    </div>

    <!-- Toolbar: Search & Expand/Collapse -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="expandAll()"
        title="Tout développer"
        class="px-2.5 py-1 text-xs text-white/90 hover:text-white bg-white/10 hover:bg-white/20 rounded transition-all flex items-center gap-1.5 font-medium"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
        <span class="hidden md:inline">Développer</span>
      </button>

      <button
        type="button"
        (click)="collapseAll()"
        title="Tout réduire"
        class="px-2.5 py-1 text-xs text-white/90 hover:text-white bg-white/10 hover:bg-white/20 rounded transition-all flex items-center gap-1.5 font-medium"
      >
        <svg class="w-3.5 h-3.5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
        <span class="hidden md:inline">Réduire</span>
      </button>
    </div>
  </div>

  <!-- Search Filter Input -->
  @if (searchable) {
    <div class="p-2.5 bg-slate-50/70 border-b border-slate-200">
      <div class="relative flex items-center">
        <span class="absolute left-3 text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
        <input
          type="text"
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          placeholder="Filtrer l'arborescence..."
          class="w-full pl-8 pr-7 py-1.5 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#009CDE] focus:ring-1 focus:ring-[#009CDE] transition-all"
        />
        @if (searchQuery()) {
          <button
            type="button"
            (click)="searchQuery.set('')"
            class="absolute right-2.5 text-slate-400 hover:text-slate-600"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        }
      </div>
    </div>
  }

  <!-- Tree View Body -->
  <div class="p-2.5 max-h-[460px] overflow-y-auto custom-scrollbar bg-white">
    @if (nodes.length === 0) {
      <div class="py-8 text-center text-slate-400 text-xs font-sans">
        Aucune donnée d'arborescence disponible
      </div>
    } @else {
      @for (node of nodes; track node.id) {
        <app-safran-file-tree-node
          [node]="node"
          [level]="0"
          [selectedNodeId]="selectedNodeId"
          [searchQuery]="searchQuery()"
          [nodeActions]="nodeActions"
          (nodeSelect)="nodeSelect.emit($event)"
          (nodeToggle)="nodeToggle.emit($event)"
          (nodeAction)="nodeAction.emit($event)"
        ></app-safran-file-tree-node>
      }
    }
  </div>
</div>

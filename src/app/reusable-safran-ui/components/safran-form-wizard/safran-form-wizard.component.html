<div class="w-full bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden font-sans">

  <!-- ── Header Banner ────────────────────────────────────────────────── -->
  <div class="px-6 py-5 bg-[#00205B] text-white">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h3 class="text-base font-bold uppercase tracking-wider text-white">{{ resolvedTitle }}</h3>
        @if (resolvedSubtitle) {
          <p class="text-xs text-white/70 font-normal mt-0.5">{{ resolvedSubtitle }}</p>
        }
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold px-2.5 py-1 rounded bg-white/10 border border-white/20 text-sky-200">
          Étape {{ currentStepIndex() + 1 }} sur {{ steps.length }}
        </span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-black/20 h-1.5 rounded-full mt-4 overflow-hidden">
      <div
        class="bg-[#009CDE] h-full transition-all duration-300 ease-out rounded-full"
        [style.width.%]="progressPercentage"
      ></div>
    </div>
  </div>

  <!-- ── Stepper Navigation Bar ──────────────────────────────────────── -->
  <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 overflow-x-auto">
    <div class="flex items-center justify-between min-w-[500px]">
      @for (step of steps; track step.id; let idx = $index) {
        <button
          type="button"
          (click)="goToStep(idx)"
          [disabled]="idx > currentStepIndex() && !config.allowStepJump"
          class="flex items-center gap-2 text-left group focus:outline-none transition-all disabled:opacity-50"
        >
          <!-- Number / Check Badge -->
          <div
            class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all"
            [class.bg-[#00205B]]="idx === currentStepIndex()"
            [class.text-white]="idx <= currentStepIndex()"
            [class.bg-emerald-600]="idx < currentStepIndex()"
            [class.bg-slate-200]="idx > currentStepIndex()"
            [class.text-slate-600]="idx > currentStepIndex()"
          >
            @if (idx < currentStepIndex()) {
              ✓
            } @else {
              {{ idx + 1 }}
            }
          </div>

          <!-- Step Label -->
          <div class="hidden sm:block">
            <p
              class="text-xs font-bold transition-colors"
              [class.text-[#00205B]]="idx === currentStepIndex()"
              [class.text-slate-700]="idx < currentStepIndex()"
              [class.text-slate-400]="idx > currentStepIndex()"
            >
              {{ step.label }}
            </p>
            @if (step.description) {
              <p class="text-[10px] text-slate-400 font-normal truncate max-w-[120px]">
                {{ step.description }}
              </p>
            }
          </div>
        </button>

        <!-- Divider line between steps -->
        @if (idx < steps.length - 1) {
          <div
            class="flex-1 h-0.5 mx-3 transition-colors"
            [class.bg-emerald-500]="idx < currentStepIndex()"
            [class.bg-slate-200]="idx >= currentStepIndex()"
          ></div>
        }
      }
    </div>
  </div>

  <!-- ── Current Step Form ────────────────────────────────────────────── -->
  @if (currentStep) {
    <div class="p-6">
      <app-safran-dynamic-form
        [fields]="currentStep.fields"
        [initialData]="accumulatedData"
        [config]="{
          title: currentStep.label,
          subtitle: currentStep.description,
          showCancel: false,
          showReset: false,
          submitLabel: isLastStep ? resolvedSubmitLabel : resolvedNextLabel
        }"
        [loading]="loading"
        (formSubmit)="onStepFormSubmit($event)"
      ></app-safran-dynamic-form>
    </div>
  }

  <!-- ── Footer Navigation Actions ───────────────────────────────────── -->
  <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-t border-slate-200">
    <button
      type="button"
      (click)="prevStep()"
      [disabled]="isFirstStep || loading"
      class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-xs"
    >
      ← {{ resolvedPrevLabel }}
    </button>

    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="loading"
        class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors"
      >
        Annuler
      </button>

      <button
        type="button"
        (click)="nextStep()"
        [disabled]="loading"
        class="flex items-center gap-2 px-5 py-2 text-xs font-semibold text-white bg-[#00205B] hover:bg-[#00153D] rounded-lg shadow-xs transition-all"
      >
        @if (isLastStep) {
          <span>{{ resolvedSubmitLabel }}</span>
          <span>✓</span>
        } @else {
          <span>{{ resolvedNextLabel }}</span>
          <span>→</span>
        }
      </button>
    </div>
  </div>

</div>
